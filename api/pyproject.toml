[project]
name = "countersign-api"
version = "0.1.0"
description = "Countersign API: Mongo notes with immutable versions and a cross-DB consistency view, authorised through Postgres RLS as the calling user."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.10",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
